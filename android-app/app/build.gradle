plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ccn.examroom'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ccn.examroom'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Signed with the keystore the build workflow provides (see .github/workflows/android-app.yml).
    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS') ?: 'ccn'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
