t x='640' y='348' font-size='14' text-anchor='start' fill='#1B2631'>WARM, dry</text><text x='30' y='400' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Key: ↑ high · ↓ low. Neurogenic is the ONLY one with a SLOW pulse. Septic and neurogenic have LOW SVR (vasodilated).</text><text x='30' y='422' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>SVR normal 800–1200 dyn·s/cm⁵ · CO 4–8 L/min · CI 2.5–4 L/min/m² · PAWP 6–12 mmHg · CVP 2–8 mmHg</text></svg>