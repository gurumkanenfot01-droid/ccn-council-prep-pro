<svg xmlns='http://www.w3.org/2000/svg' width='840' height='450' viewBox='0 0 840 450' font-family='Arial, Helvetica, sans-serif'><rect width='840' height='450' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='420.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Capnography (EtCO₂) Waveforms</text><line x1='40' y1='170' x2='370' y2='170' stroke='#7F8C8D' stroke-width='1'/><polyline fill='none' stroke='#1E8449' stroke-width='3' points='40,170 60,170 75,80 150,70 160,170 210,170 225,80 300,70 310,170 370,170'/><text x='40' y='192' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>NORMAL: square waves, EtCO₂ 35–45 mmHg</text><text x='40' y='212' font-size='11' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Phases: I baseline · II upstroke · III plateau (EtCO₂ = end) · 0 inspiration</text><line x1='440' y1='170' x2='770' y2='170' stroke='#7F8C8D' stroke-width='1'/><polyline fill='none' stroke='#D68910' stroke-width='3' points='440,170 460,170 500,110 550,70 560,170 610,170 650,110 700,70 710,170 770,170'/><text x='440' y='192' font-size='13' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SHARK FIN: bronchospasm / COPD / asthma</text><line x1='40' y1='330' x2='370' y2='330' stroke='#7F8C8D' stroke-width='1'/><polyline fill='none' stroke='#C0392B' stroke-width='3' points='40,330 60,330 75,240 150,230 160,330 370,330'/><text x='40' y='352' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SUDDEN FLAT LINE: extubation, disconnection,</text><text x='40' y='370' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>oesophageal tube, complete obstruction, arrest</text><line x1='440' y1='330' x2='770' y2='330' stroke='#7F8C8D' stroke-width='1'/><polyline fill='none' stroke='#7D3C98' stroke-width='3' points='440,330 460,330 475,240 510,235 518,260 526,233 550,230 560,330 770,330'/><text x='440' y='352' font-size='13' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CURARE CLEFT: patient breathing against the</text><text x='440' y='370' font-size='13' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ventilator (paralysis wearing off / asynchrony)</text><text x='420' y='410' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>In CPR: EtCO₂ &lt; 10 mmHg = poor compressions · sudden rise to > 35–40 mmHg = return of circulation (ROSC)</text><text x='420' y='430' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Gradual fall: hypothermia, hyperventilation, falling cardiac output, PE · Gradual rise: hypoventilation, fever, sepsis, MH</text></svg>