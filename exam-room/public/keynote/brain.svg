<svg xmlns='http://www.w3.org/2000/svg' width='800' height='610' viewBox='0 0 800 610' font-family='Arial, Helvetica, sans-serif'><rect width='800' height='610' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='400.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>The Brain — Regions and Functions</text><path d='M150,330 C120,200 250,90 420,90 C580,90 680,180 660,300 C650,360 600,380 560,380 L250,380 C190,380 160,360 150,330 Z' fill='#FEF9E7' stroke='#7F8C8D' stroke-width='2'/><path d='M330,95 C340,200 330,260 300,380' fill='none' stroke='#7F8C8D' stroke-dasharray='6,4'/><path d='M520,110 C500,200 520,300 560,380' fill='none' stroke='#7F8C8D' stroke-dasharray='6,4'/><path d='M180,300 C260,280 400,290 520,300' fill='none' stroke='#7F8C8D' stroke-dasharray='6,4'/><text x='225' y='200' font-size='16' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>FRONTAL</text><text x='225' y='220' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>personality, judgement,</text><text x='225' y='236' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>voluntary movement (motor),</text><text x='225' y='252' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Broca's area — speech output</text><text x='430' y='170' font-size='16' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PARIETAL</text><text x='430' y='190' font-size='12' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>sensation, spatial awareness</text><text x='600' y='230' font-size='16' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>OCCIPITAL</text><text x='600' y='250' font-size='12' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>vision</text><text x='380' y='330' font-size='16' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>TEMPORAL</text><text x='380' y='350' font-size='12' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>hearing, memory, Wernicke's — understanding</text><ellipse cx='590' cy='420' rx='80' ry='45' fill='#E8DAEF' stroke='#7D3C98'/><text x='590' y='418' font-size='14' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CEREBELLUM</text><text x='590' y='436' font-size='12' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>balance, coordination</text><path d='M440,380 L470,380 L475,560 L445,560 Z' fill='#FADBD8' stroke='#C0392B'/><text x='430' y='410' font-size='14' text-anchor='end' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>BRAINSTEM:</text><text x='430' y='428' font-size='12' text-anchor='end' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Midbrain — pupils (CN III), arousal</text><text x='430' y='446' font-size='12' text-anchor='end' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Pons — breathing pattern</text><text x='430' y='464' font-size='12' text-anchor='end' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Medulla — breathing, HR, BP, cough, gag</text><text x='430' y='482' font-size='12' text-anchor='end' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(RAS: consciousness)</text><text x='485' y='540' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>→ spinal cord</text><text x='400' y='590' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Left hemisphere controls the RIGHT side of the body (and vice versa). Hypothalamus: temperature, thirst, ADH; pituitary below it.</text></svg>