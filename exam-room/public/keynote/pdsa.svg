<svg xmlns='http://www.w3.org/2000/svg' width='880' height='500' viewBox='0 0 880 500' font-family='Arial, Helvetica, sans-serif'><rect width='880' height='500' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='440.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>PDSA Cycle and Quality Improvement</text><path d='M300,290 L180,170 A170,170 0 0 1 420,170 Z' fill='#2E6DB4' opacity='0.18' stroke='#2E6DB4' stroke-width='2'/><text x='300.0' y='180.0' font-size='18' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PLAN</text><text x='300.0' y='200.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Aim, change idea,</text><text x='300.0' y='214.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>predict, who/when</text><path d='M300,290 L420,170 A170,170 0 0 1 420,410 Z' fill='#1E8449' opacity='0.18' stroke='#1E8449' stroke-width='2'/><text x='400.0' y='280.0' font-size='18' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>DO</text><text x='400.0' y='300.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Try it on a small</text><text x='400.0' y='314.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>scale; record data</text><path d='M300,290 L420,410 A170,170 0 0 1 180,410 Z' fill='#D68910' opacity='0.18' stroke='#D68910' stroke-width='2'/><text x='300.0' y='380.0' font-size='18' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STUDY</text><text x='300.0' y='400.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Compare results with</text><text x='300.0' y='414.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>prediction; learn</text><path d='M300,290 L180,410 A170,170 0 0 1 180,170 Z' fill='#C0392B' opacity='0.18' stroke='#C0392B' stroke-width='2'/><text x='200.0' y='280.0' font-size='18' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ACT</text><text x='200.0' y='300.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Adopt, adapt or</text><text x='200.0' y='314.0' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>abandon; next cycle</text><text x='300' y='490' font-size='14' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Plan → Do → Study → Act → (repeat)</text><rect x='520' y='90' width='330' height='380' rx='8' fill='#FDFEFE' stroke='#7F8C8D' stroke-width='1.5'/><text x='535' y='115' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Quality words for the exam:</text><text x='535' y='132' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'></text><text x='535' y='149' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Audit = compare practice with a</text><text x='535' y='166' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>standard → change → RE-AUDIT</text><text x='535' y='183' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(closing the audit loop).</text><text x='535' y='200' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'></text><text x='535' y='217' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Donabedian: STRUCTURE → PROCESS</text><text x='535' y='234' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>→ OUTCOME.</text><text x='535' y='251' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'></text><text x='535' y='268' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Root cause analysis (RCA) = ask</text><text x='535' y='285' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>'why?' (5 whys, fishbone) after</text><text x='535' y='302' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>a serious incident — fix systems,</text><text x='535' y='319' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>not blame people.</text><text x='535' y='336' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'></text><text x='535' y='353' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>SMART objectives: Specific,</text><text x='535' y='370' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Measurable, Achievable, Realistic,</text><text x='535' y='387' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Time-bound.</text><text x='535' y='404' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'></text><text x='535' y='421' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>SWOT: Strengths, Weaknesses,</text><text x='535' y='438' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Opportunities, Threats.</text></svg>