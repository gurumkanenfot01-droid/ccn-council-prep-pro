<svg xmlns='http://www.w3.org/2000/svg' width='860' height='790' viewBox='0 0 860 790' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='790' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Defibrillator Pad Placement and Shock Rules</text><g transform='translate(0,45)'><path d='M300,80 C250,80 230,120 230,160 L200,200 L180,520 L520,520 L500,200 L470,160 C470,120 450,80 400,80 Z' fill='#FDF2E9' stroke='#1B2631' stroke-width='2'/><ellipse cx='350' cy='60' rx='50' ry='45' fill='#FDF2E9' stroke='#1B2631' stroke-width='2'/><line x1='350' y1='180' x2='350' y2='330' stroke='#7F8C8D' stroke-width='6'/><text x='350' y='345' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>sternum</text><rect x='255' y='190' width='70' height='95' rx='8' fill='#C0392B' opacity='0.85'/><text x='290' y='245' font-size='22' text-anchor='middle' fill='white' font-weight='bold'>1</text><rect x='405' y='330' width='95' height='70' rx='8' fill='#C0392B' opacity='0.85' transform='rotate(-20 452 365)'/><text x='452' y='372' font-size='22' text-anchor='middle' fill='white' font-weight='bold'>2</text><text x='140' y='210' font-size='14' text-anchor='end' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STERNAL pad:</text><text x='140' y='228' font-size='13' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>right of sternum,</text><text x='140' y='245' font-size='13' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>below clavicle</text><line x1='145' y1='225' x2='250' y2='235' stroke='#1B2631' stroke-width='1.2' marker-end='url(#ar)'/><text x='560' y='360' font-size='14' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>APICAL pad:</text><text x='560' y='378' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>left mid-axillary line,</text><text x='560' y='395' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>V6 level (5th ICS)</text><line x1='555' y1='370' x2='505' y2='368' stroke='#1B2631' stroke-width='1.2' marker-end='url(#ar)'/></g><rect x='40' y='600' width='780' height='180' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='60' y='625' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SHOCKABLE: VF and pulseless VT → shock (biphasic 150–200 J), then CPR 2 min at once (no pulse check).</text><text x='60' y='647' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>NON-SHOCKABLE: asystole and PEA → CPR + adrenaline 1 mg IV ASAP, then every 3–5 min. Look for 4 Hs and 4 Ts.</text><text x='60' y='669' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>CARDIOVERSION (synchronised): unstable VT with pulse, AF/flutter, SVT. SYNC button ON so shock lands on the R wave.</text><text x='60' y='691' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Safety: oxygen away 1 m, remove GTN patches, dry chest, pads 8 cm from pacemaker/ICD, 'Stand clear, oxygen away'.</text><text x='60' y='713' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Amiodarone 300 mg after 3rd shock, 150 mg after 5th. Paediatric shock: 4 J/kg.</text><text x='60' y='735' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Daily check of the defibrillator: battery, pads expiry, paper, test discharge (as per unit policy) and document it.</text><text x='60' y='757' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Pacing pads (transcutaneous): front-back (anterior–posterior) for symptomatic bradycardia not responding to atropine.</text></svg>