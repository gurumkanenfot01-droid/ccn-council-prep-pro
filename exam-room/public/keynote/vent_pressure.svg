<svg xmlns='http://www.w3.org/2000/svg' width='900' height='585' viewBox='0 0 900 585' font-family='Arial, Helvetica, sans-serif'><rect width='900' height='585' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='450.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Ventilator Pressure–Time Waveform: PIP, Plateau and PEEP</text><line x1='80' y1='420' x2='760' y2='420' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><line x1='80' y1='420' x2='80' y2='80' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='420' y='455' font-size='14' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Time →</text><text x='35' y='250' font-size='14' font-weight='bold' transform='rotate(-90 35,250)' text-anchor='middle'>Airway pressure (cmH₂O) →</text><polyline fill='none' stroke='#2E6DB4' stroke-width='3' points='90,350 110,350 200,120 210,210 260,210 275,350 400,350'/><polyline fill='none' stroke='#2E6DB4' stroke-width='3' points='420,350 440,350 530,120 540,210 590,210 605,350 730,350'/><line x1='80' y1='350' x2='760' y2='350' stroke='#1E8449' stroke-width='1.5' stroke-dasharray='6,4'/><text x='765' y='354' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PEEP (e.g. 5–10)</text><line x1='80' y1='120' x2='760' y2='120' stroke='#C0392B' stroke-width='1.5' stroke-dasharray='6,4'/><text x='765' y='124' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PIP (peak)</text><line x1='80' y1='210' x2='760' y2='210' stroke='#7D3C98' stroke-width='1.5' stroke-dasharray='6,4'/><text x='765' y='214' font-size='13' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Pplat (plateau)</text><text x='235' y='108' font-size='12' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>inspiratory pause →</text><line x1='330' y1='210' x2='330' y2='350' stroke='#D68910' stroke-width='3' marker-end='url(#ar)'/><line x1='330' y1='350' x2='330' y2='210' stroke='#D68910' stroke-width='3' marker-end='url(#ar)'/><text x='340' y='280.0' font-size='12' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Driving pressure</text><text x='340' y='295.0' font-size='12' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>= Pplat − PEEP</text><text x='340' y='310.0' font-size='12' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(keep ≤ 15)</text><line x1='390' y1='120' x2='390' y2='210' stroke='#C0392B' stroke-width='3' marker-end='url(#ar)'/><line x1='390' y1='210' x2='390' y2='120' stroke='#C0392B' stroke-width='3' marker-end='url(#ar)'/><text x='395' y='155' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PIP − Pplat</text><text x='395' y='170' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>= airway</text><text x='395' y='185' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>resistance</text><rect x='20' y='470' width='860' height='100' rx='8' fill='#FDFEFE' stroke='#7F8C8D' stroke-width='1.5'/><text x='30' y='492' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PIP ↑ but Pplat NORMAL → RESISTANCE problem: secretions, biting, kinked tube, bronchospasm → suction, bite block, bronchodilator</text><text x='30' y='514' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PIP ↑ AND Pplat ↑ → COMPLIANCE problem (stiff lung/chest): pneumothorax, ARDS, pulmonary oedema, atelectasis, abdominal distension</text><text x='30' y='536' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Targets: Pplat ≤ 30 · PIP usually &lt; 35–40 · Driving pressure ≤ 15 cmH₂O · Compliance = Vt ÷ (Pplat − PEEP), normal 50–100 mL/cmH₂O</text><text x='30' y='558' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Low-pressure alarm = leak/disconnection (cuff leak, circuit off, extubation) — check patient first, then circuit</text></svg>