<svg xmlns='http://www.w3.org/2000/svg' width='820' height='520' viewBox='0 0 820 520' font-family='Arial, Helvetica, sans-serif'><rect width='820' height='520' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='410.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Intracranial Pressure–Volume Curve (Monro–Kellie)</text><line x1='90' y1='440' x2='720' y2='440' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><line x1='90' y1='440' x2='90' y2='70' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='400' y='475' font-size='14' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Added intracranial volume (blood, oedema, haematoma, tumour, CSF) →</text><text x='40' y='255' font-size='14' font-weight='bold' transform='rotate(-90 40,255)' text-anchor='middle'>ICP (mmHg) →</text><polyline fill='none' stroke='#C0392B' stroke-width='4' points='90,408 96,408 102,407 108,407 114,406 120,406 126,405 132,405 138,404 144,404 150,403 156,402 162,401 168,401 174,400 180,399 186,398 192,397 198,396 204,395 210,394 216,392 222,391 228,390 234,388 240,387 246,385 252,383 258,381 264,379 270,377 276,375 282,372 288,370 294,367 300,364 306,361 312,358 318,355 324,351 330,347 336,343 342,339 348,334 354,329 360,324 366,319 372,313 378,307 384,300 390,293 396,286 402,278 408,270 414,261 420,252 426,242 432,231 438,220 444,209 450,196 456,183 462,169 468,154 474,138 480,122 486,104 492,85 498,65'/><line x1='90' y1='392.0' x2='720' y2='392.0' stroke='#7F8C8D' stroke-width='1' stroke-dasharray='6,4'/><text x='715' y='386.0' font-size='12' text-anchor='end' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Normal ICP 5–15 mmHg</text><line x1='90' y1='376.0' x2='720' y2='376.0' stroke='#D68910' stroke-width='1' stroke-dasharray='6,4'/><text x='715' y='370.0' font-size='12' text-anchor='end' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Treat if > 20–22 mmHg</text><rect x='110' y='330' width='250' height='70' rx='8' fill='#E9F7EF' stroke='#1E8449' stroke-width='1.5'/><text x='120' y='352' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>1. COMPENSATION</text><text x='120' y='370' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>CSF pushed to spinal canal,</text><text x='120' y='386' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>venous blood squeezed out</text><rect x='300' y='250' width='170' height='60' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='310' y='272' font-size='13' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>2. Reserve used up</text><text x='310' y='290' font-size='12' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>small volume ↑ = big ICP ↑</text><rect x='490' y='190' width='300' height='95' rx='8' fill='#FDEDEC' stroke='#C0392B' stroke-width='1.5'/><text x='500' y='212' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>3. DECOMPENSATION</text><text x='500' y='230' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>ICP soars → CPP falls → herniation</text><text x='500' y='248' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Late signs: Cushing's triad —</text><text x='500' y='266' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>↑BP (wide pulse pressure), ↓HR, irregular RR</text><text x='400' y='505' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Monro–Kellie: skull is rigid; brain 80% + blood 10% + CSF 10%. Volume ↑ in one must be matched by ↓ in another.  CPP = MAP − ICP (keep 60–70)</text></svg>