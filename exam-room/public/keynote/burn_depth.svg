<svg xmlns='http://www.w3.org/2000/svg' width='900' height='490' viewBox='0 0 900 490' font-family='Arial, Helvetica, sans-serif'><rect width='900' height='490' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='450.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Burn Depth and Skin Layers</text><rect x='60' y='80' width='420' height='50' fill='#FDEBD0' stroke='#D68910'/><text x='270' y='110' font-size='15' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>EPIDERMIS</text><rect x='60' y='130' width='420' height='150' fill='#FADBD8' stroke='#C0392B'/><text x='270' y='180' font-size='15' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>DERMIS</text><text x='270' y='200' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(nerve endings, hair follicles, sweat glands, vessels)</text><rect x='60' y='280' width='420' height='90' fill='#FCF3CF' stroke='#D68910'/><text x='270' y='330' font-size='15' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SUBCUTANEOUS FAT</text><rect x='60' y='370' width='420' height='60' fill='#E8DAEF' stroke='#7D3C98'/><text x='270' y='405' font-size='15' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>MUSCLE / BONE</text><line x1='480' y1='130' x2='520' y2='130' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='525' y='126' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Superficial (1st°)</text><text x='525' y='143' font-size='11' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Epidermis only · red, painful, no blisters (sunburn) · heals ~7 days</text><line x1='480' y1='200' x2='520' y2='200' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='525' y='196' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Superficial partial (2nd°)</text><text x='525' y='213' font-size='11' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Upper dermis · BLISTERS, moist, very painful, blanches · 2–3 weeks</text><line x1='480' y1='280' x2='520' y2='280' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='525' y='276' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Deep partial (2nd°)</text><text x='525' y='293' font-size='11' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Deep dermis · blotchy, less painful, slow refill · may need graft</text><line x1='480' y1='370' x2='520' y2='370' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='525' y='366' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Full thickness (3rd°)</text><text x='525' y='383' font-size='11' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>All dermis · white/leathery/charred, PAINLESS (nerves destroyed) · graft</text><line x1='480' y1='430' x2='520' y2='430' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><text x='525' y='426' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>4th degree</text><text x='525' y='443' font-size='11' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Into muscle/bone · amputation/major surgery</text><text x='420' y='470' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Only partial- and full-thickness burns count in %TBSA for fluid resuscitation (Parkland)</text></svg>