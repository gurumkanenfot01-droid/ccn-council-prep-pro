<svg xmlns='http://www.w3.org/2000/svg' width='840' height='670' viewBox='0 0 840 670' font-family='Arial, Helvetica, sans-serif'><rect width='840' height='670' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='420.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Arterial Line Waveform and the Square-Wave Test</text><line x1='60' y1='300' x2='520' y2='300' stroke='#7F8C8D' stroke-width='1'/><text x='60' y='320' font-size='12' text-anchor='start' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>time →</text><g transform='translate(0,0)'><path d='M60,280 C75,280 80,120 100,110 C115,105 125,150 140,175 L148,170 C160,190 180,250 210,280' fill='none' stroke='#C0392B' stroke-width='3'/></g><g transform='translate(150,0)'><path d='M60,280 C75,280 80,120 100,110 C115,105 125,150 140,175 L148,170 C160,190 180,250 210,280' fill='none' stroke='#C0392B' stroke-width='3'/></g><line x1='360' y1='280' x2='380' y2='280' stroke='#C0392B' stroke-width='3'/><line x1='255' y1='105' x2='400' y2='80' stroke='#1B2631' stroke-width='1.2' marker-end='url(#ar)'/><text x='405' y='78' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Systolic peak (SBP ~120)</text><line x1='146' y1='172' x2='240' y2='140' stroke='#1B2631' stroke-width='1.2' marker-end='url(#ar)'/><text x='245' y='135' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Dicrotic notch = aortic valve closes</text><line x1='205' y1='278' x2='240' y2='250' stroke='#1B2631' stroke-width='1.2' marker-end='url(#ar)'/><text x='245' y='245' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>End-diastole (DBP ~80)</text><line x1='60' y1='225' x2='520' y2='225' stroke='#1E8449' stroke-width='2' stroke-dasharray='8,5'/><text x='525' y='229' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>MAP ≈ 93</text><text x='40' y='370' font-size='14' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>MAP = (SBP + 2 × DBP) ÷ 3 · Keep MAP ≥ 65 mmHg for organ perfusion</text><text x='40' y='392' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Transducer level = PHLEBOSTATIC AXIS (4th intercostal space, mid-axillary line). Zero to air at this level.</text><rect x='20' y='420' width='250' height='200' rx='8' fill='#FDFEFE' stroke='#7F8C8D' stroke-width='1.5'/><text x='145' y='445' font-size='15' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Optimally damped</text><polyline points='40,560 70,560 70,470 130,470 130,580' fill='none' stroke='#1E8449' stroke-width='2.5' stroke-linejoin='round'/><path d='M130,580 L140,548 L150,566 C170,560 220,560 250,560' fill='none' stroke='#1E8449' stroke-width='2.5'/><text x='145' y='600' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>1–2 oscillations then baseline</text><text x='145' y='615' font-size='12' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>→ reading is accurate</text><rect x='290' y='420' width='250' height='200' rx='8' fill='#FDFEFE' stroke='#7F8C8D' stroke-width='1.5'/><text x='415' y='445' font-size='15' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Over-damped</text><polyline points='310,560 340,560 340,470 400,470 400,470' fill='none' stroke='#2E6DB4' stroke-width='2.5' stroke-linejoin='round'/><path d='M400,470 C420,540 460,560 520,560' fill='none' stroke='#2E6DB4' stroke-width='2.5'/><text x='415' y='600' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Slow, sloped return, no bounce</text><text x='415' y='615' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SBP falsely LOW (air bubble, clot, kink)</text><rect x='560' y='420' width='250' height='200' rx='8' fill='#FDFEFE' stroke='#7F8C8D' stroke-width='1.5'/><text x='685' y='445' font-size='15' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Under-damped</text><polyline points='580,560 610,560 610,470 670,470 670,580' fill='none' stroke='#C0392B' stroke-width='2.5' stroke-linejoin='round'/><path d='M670,580 L678,520 L686,595 L694,530 L702,585 L710,542 L720,572 L732,554 L790,560' fill='none' stroke='#C0392B' stroke-width='2.5'/><text x='685' y='600' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Many oscillations (ringing)</text><text x='685' y='615' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SBP falsely HIGH (long/stiff tubing)</text><text x='420' y='650' font-size='14' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Square-wave (fast-flush) test: pull the flush tab, let go, watch the bounce</text></svg>