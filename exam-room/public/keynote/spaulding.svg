<svg xmlns='http://www.w3.org/2000/svg' width='860' height='590' viewBox='0 0 860 590' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='590' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Spaulding Classification: How Clean must the Item be?</text><rect x='40' y='70' width='780' height='135' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='60' y='100' font-size='18' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CRITICAL</text><text x='60' y='122' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Enters sterile tissue or blood</text><text x='60' y='148' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Surgical instruments, urinary catheters,</text><text x='60' y='164' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>IV cannulae, implants</text><text x='470' y='105' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STERILISATION</text><text x='470' y='121' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(autoclave 121 °C 15 min / 134 °C 3 min,</text><text x='470' y='137' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ethylene oxide, plasma)</text><rect x='40' y='220' width='780' height='135' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='60' y='250' font-size='18' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>SEMI-CRITICAL</text><text x='60' y='272' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Touches mucous membrane or broken skin</text><text x='60' y='298' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Laryngoscope blades, endoscopes,</text><text x='60' y='314' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>ventilator circuits, thermometers</text><text x='470' y='255' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>HIGH-LEVEL DISINFECTION</text><text x='470' y='271' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(glutaraldehyde 2%, peracetic acid,</text><text x='470' y='287' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>orthophthalaldehyde) or sterilise</text><rect x='40' y='370' width='780' height='135' rx='8' fill='#E8F8F5' stroke='#1E8449' stroke-width='1.5'/><text x='60' y='400' font-size='18' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>NON-CRITICAL</text><text x='60' y='422' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Touches intact skin only</text><text x='60' y='448' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>BP cuffs, stethoscopes, bed rails,</text><text x='60' y='464' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>bedpans, monitors</text><text x='470' y='405' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>LOW-LEVEL DISINFECTION / CLEANING</text><text x='470' y='421' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(detergent, 70% alcohol,</text><text x='470' y='437' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>chlorine 1:1000)</text><text x='430' y='545' font-size='14' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Cleaning ALWAYS comes first — dirt protects germs from disinfectant and steam.</text><text x='430' y='568' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Sterilisation kills ALL microbes including spores; disinfection kills most but not all spores.</text></svg>