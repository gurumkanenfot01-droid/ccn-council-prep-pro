<svg xmlns='http://www.w3.org/2000/svg' width='840' height='540' viewBox='0 0 840 540' font-family='Arial, Helvetica, sans-serif'><rect width='840' height='540' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='420.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>ICP Waveform: P1, P2, P3</text><rect x='40' y='50' width='360' height='280' rx='8' fill='#FDFEFE' stroke='#1E8449' stroke-width='1.5'/><text x='220' y='75' font-size='15' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>NORMAL compliance</text><g transform='translate(0,30)'><path d='M130,250 C140,250 145,100 160,100 C175,100 180,120 195,120 C205,120 210,150 220,150 C230,150 235,175 245,180 C270,200 290,245 310,250' fill='none' stroke='#1E8449' stroke-width='3'/><text x='160' y='92' font-size='14' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P1</text><text x='195' y='112' font-size='14' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P2</text><text x='222' y='142' font-size='14' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P3</text></g><text x='220' y='318' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P1 > P2 > P3  (staircase down)</text><rect x='440' y='50' width='360' height='280' rx='8' fill='#FDFEFE' stroke='#C0392B' stroke-width='1.5'/><text x='620' y='75' font-size='15' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>POOR compliance (danger)</text><g transform='translate(0,40)'><path d='M530,250 C540,250 545,100 560,100 C575,100 580,70 595,70 C605,70 610,150 620,150 C630,150 635,175 645,180 C670,200 690,245 710,250' fill='none' stroke='#C0392B' stroke-width='3'/><text x='560' y='92' font-size='14' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P1</text><text x='595' y='62' font-size='1' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'></text><text x='598' y='62' font-size='14' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P2</text></g><text x='620' y='318' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P2 > P1 → brain is 'full', ICP about to rise</text><rect x='40' y='350' width='760' height='170' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='60' y='375' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>P1 = percussion wave (arterial pulse) · P2 = tidal wave (brain compliance) · P3 = dicrotic (aortic valve closure).</text><text x='60' y='398' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Normal ICP 5–15 mmHg (adult). Treat above 20–22 mmHg. CPP = MAP − ICP; keep CPP 60–70 mmHg.</text><text x='60' y='421' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Lundberg A (plateau) waves: ICP 50–100 mmHg for 5–20 min = emergency. B waves: 0.5–2/min, with breathing changes.</text><text x='60' y='444' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Lower ICP: head up 30°, head straight (neck veins open), no tight ETT ties, normothermia, sedation, PaCO₂ 35–40,</text><text x='60' y='467' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>osmotherapy (mannitol 0.25–1 g/kg or hypertonic saline), drain CSF (EVD), avoid suction >10 s, avoid hypotension/hypoxia.</text><text x='60' y='490' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Cushing triad (late sign): HIGH BP with wide pulse pressure, SLOW pulse, IRREGULAR breathing.</text></svg>