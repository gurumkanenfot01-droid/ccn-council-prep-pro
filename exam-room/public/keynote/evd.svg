<svg xmlns='http://www.w3.org/2000/svg' width='860' height='720' viewBox='0 0 860 720' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='720' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>External Ventricular Drain (EVD) Set-up</text><ellipse cx='200' cy='300' rx='120' ry='140' fill='#F5EEF8' stroke='#7D3C98' stroke-width='2'/><ellipse cx='210' cy='280' rx='40' ry='22' fill='#D6EAF8' stroke='#2E6DB4'/><text x='210' y='285' font-size='11' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>ventricle</text><line x1='210' y1='165' x2='210' y2='270' stroke='#1B2631' stroke-width='3'/><text x='225' y='200' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>catheter via burr hole</text><circle cx='330' cy='300' r='7' fill='#D68910' stroke='#D68910' stroke-width='1.5'/><text x='345' y='330' font-size='12' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Tragus of ear = ZERO</text><text x='345' y='345' font-size='12' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(level of foramen of Monro)</text><path d='M210,165 C260,90 450,80 520,110' fill='none' stroke='#1B2631' stroke-width='3'/><line x1='330' y1='300' x2='600' y2='300' stroke='#D68910' stroke-width='2' stroke-dasharray='6,4'/><rect x='500' y='110' width='60' height='120' rx='8' fill='#FDFEFE' stroke='#1B2631' stroke-width='1.5'/><text x='530' y='102' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>drip chamber</text><line x1='600' y1='300' x2='600' y2='160' stroke='#1E8449' stroke-width='2' marker-end='url(#ar)'/><text x='610' y='230' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Height above tragus</text><text x='610' y='248' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>usually 10–20 cmH₂O</text><line x1='530' y1='230' x2='530' y2='430' stroke='#1B2631' stroke-width='3'/><rect x='490' y='430' width='80' height='100' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='530' y='485' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>bag</text><rect x='30' y='560' width='800' height='140' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='50' y='585' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CSF drains only when ICP is HIGHER than the set height. Raise the chamber = less drainage; lower = more drainage.</text><text x='50' y='607' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>CLAMP before moving/repositioning the patient or the bed, then re-level and unclamp (over-drainage → ventricles collapse, bleed).</text><text x='50' y='629' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Normal CSF output ~ 5–10 mL/hr. Check: colour (clear; blood = bleed; cloudy = infection), volume, swing of fluid.</text><text x='50' y='651' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Strict asepsis — ventriculitis risk. No drainage + rising ICP = blocked catheter → inform neurosurgeon.</text><text x='50' y='673' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Licox (PbtO₂) probe = brain-tissue oxygen: normal 20–35 mmHg; below 20 = brain hypoxia, below 10 = critical.</text></svg>