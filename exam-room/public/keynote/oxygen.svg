<svg xmlns='http://www.w3.org/2000/svg' width='900' height='380' viewBox='0 0 900 380' font-family='Arial, Helvetica, sans-serif'><rect width='900' height='380' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='450.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Oxygen Delivery Devices</text><rect x='20' y='50' width='860' height='34' fill='#2E6DB4'/><text x='30' y='72' font-size='14' text-anchor='start' fill='white' font-weight='bold'>Device</text><text x='260' y='72' font-size='14' text-anchor='start' fill='white' font-weight='bold'>Flow</text><text x='390' y='72' font-size='14' text-anchor='start' fill='white' font-weight='bold'>FiO₂</text><text x='520' y='72' font-size='14' text-anchor='start' fill='white' font-weight='bold'>Key points</text><rect x='20' y='84' width='860' height='40' fill='white' stroke='#D5D8DC'/><text x='30' y='109' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Nasal cannula</text><text x='260' y='109' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>1–6 L/min</text><text x='390' y='109' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>24–44%</text><text x='520' y='109' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>~ +4% per litre; comfortable; for mild hypoxaemia</text><rect x='20' y='124' width='860' height='40' fill='#F4F6F7' stroke='#D5D8DC'/><text x='30' y='149' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Simple face mask</text><text x='260' y='149' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>5–10 L/min</text><text x='390' y='149' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>40–60%</text><text x='520' y='149' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>minimum 5 L/min to flush CO₂</text><rect x='20' y='164' width='860' height='40' fill='white' stroke='#D5D8DC'/><text x='30' y='189' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Venturi mask</text><text x='260' y='189' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>set by colour</text><text x='390' y='189' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>24–60% exact</text><text x='520' y='189' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PRECISE FiO₂ — choice in COPD (target SpO₂ 88–92%)</text><rect x='20' y='204' width='860' height='40' fill='#F4F6F7' stroke='#D5D8DC'/><text x='30' y='229' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Non-rebreather (reservoir)</text><text x='260' y='229' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>10–15 L/min</text><text x='390' y='229' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>60–90%</text><text x='520' y='229' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>reservoir bag must stay inflated; emergencies/trauma</text><rect x='20' y='244' width='860' height='40' fill='white' stroke='#D5D8DC'/><text x='30' y='269' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>High-flow nasal cannula</text><text x='260' y='269' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>up to 60 L/min</text><text x='390' y='269' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>21–100%</text><text x='520' y='269' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>heated, humidified; small PEEP; washes out dead space</text><rect x='20' y='284' width='860' height='40' fill='#F4F6F7' stroke='#D5D8DC'/><text x='30' y='309' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CPAP / BiPAP (NIV)</text><text x='260' y='309' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pressures</text><text x='390' y='309' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>21–100%</text><text x='520' y='309' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>CPAP = 1 pressure; BiPAP = IPAP + EPAP</text><rect x='20' y='324' width='860' height='40' fill='white' stroke='#D5D8DC'/><text x='30' y='349' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Bag-valve-mask</text><text x='260' y='349' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>15 L/min</text><text x='390' y='349' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>~100%</text><text x='520' y='349' font-size='12' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>with reservoir; rescue breathing/pre-oxygenation</text></svg>