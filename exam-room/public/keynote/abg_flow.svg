<svg xmlns='http://www.w3.org/2000/svg' width='820' height='670' viewBox='0 0 820 670' font-family='Arial, Helvetica, sans-serif'><rect width='820' height='670' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='410.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>5 Steps to Interpret an ABG</text><rect x='280' y='50' width='260' height='50' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='410.0' y='71.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STEP 1: Look at the pH</text><text x='410.0' y='87.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>7.35–7.45 normal</text><line x1='330' y1='100' x2='170' y2='140' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><line x1='490' y1='100' x2='650' y2='140' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><line x1='410' y1='100' x2='410' y2='140' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='40' y='140' width='260' height='55' rx='8' fill='#FDEDEC' stroke='#C0392B' stroke-width='1.5'/><text x='170.0' y='171.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>&lt; 7.35 = ACIDOSIS</text><rect x='520' y='140' width='260' height='55' rx='8' fill='#E9F7EF' stroke='#1E8449' stroke-width='1.5'/><text x='650.0' y='171.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>> 7.45 = ALKALOSIS</text><rect x='320' y='140' width='180' height='55' rx='8' fill='#FEF9E7' stroke='#D68910' stroke-width='1.5'/><text x='410.0' y='155.5' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Normal pH →</text><text x='410.0' y='171.5' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>compensated, mixed</text><text x='410.0' y='187.5' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>or normal</text><rect x='40' y='230' width='360' height='60' rx='8' fill='#FDEDEC' stroke='#C0392B' stroke-width='1.5'/><text x='220.0' y='256.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STEP 2: PaCO₂ 35–45 mmHg</text><text x='220.0' y='272.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>RESPIRATORY part (an acid)</text><rect x='420' y='230' width='360' height='60' rx='8' fill='#E9F7EF' stroke='#1E8449' stroke-width='1.5'/><text x='600.0' y='256.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STEP 3: HCO₃⁻ 22–26 mmol/L</text><text x='600.0' y='272.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>METABOLIC part (a base)</text><rect x='40' y='320' width='360' height='95' rx='8' fill='#FDEDEC' stroke='#C0392B' stroke-width='1.5'/><text x='220.0' y='355.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ROME: Respiratory = Opposite</text><text x='220.0' y='371.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pH ↓ &amp; PaCO₂ ↑ → respiratory acidosis</text><text x='220.0' y='387.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pH ↑ &amp; PaCO₂ ↓ → respiratory alkalosis</text><rect x='420' y='320' width='360' height='95' rx='8' fill='#E9F7EF' stroke='#1E8449' stroke-width='1.5'/><text x='600.0' y='355.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Metabolic = Equal</text><text x='600.0' y='371.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pH ↓ &amp; HCO₃⁻ ↓ → metabolic acidosis</text><text x='600.0' y='387.5' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pH ↑ &amp; HCO₃⁻ ↑ → metabolic alkalosis</text><rect x='40' y='445' width='740' height='110' rx='8' fill='#FEF9E7' stroke='#D68910' stroke-width='1.5'/><text x='410.0' y='480.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STEP 4: Compensation — is the OTHER value moving to correct the pH?</text><text x='410.0' y='496.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Other value NORMAL → UNCOMPENSATED</text><text x='410.0' y='512.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Other value abnormal (compensating) but pH still abnormal → PARTIALLY compensated</text><text x='410.0' y='528.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Both abnormal, pH back in 7.35–7.45 → FULLY compensated (7.35–7.39 acid side; 7.41–7.45 alkaline side)</text><rect x='40' y='585' width='740' height='70' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='410.0' y='616.0' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>STEP 5: Oxygenation — PaO₂ 80–100 mmHg (60–79 mild, 40–59 moderate, &lt; 40 severe hypoxaemia)</text><text x='410.0' y='632.0' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Both PaCO₂ and HCO₃⁻ pushing pH the SAME way = MIXED disorder (e.g. ↑CO₂ + ↓HCO₃⁻)</text></svg>