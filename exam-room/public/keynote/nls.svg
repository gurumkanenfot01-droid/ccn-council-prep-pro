<svg xmlns='http://www.w3.org/2000/svg' width='860' height='670' viewBox='0 0 860 670' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='670' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Newborn Life Support (Simplified)</text><rect x='130' y='60' width='600' height='60' rx='8' fill='#E8F8F5' stroke='#1E8449' stroke-width='1.5'/><text x='430' y='85' font-size='14' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>BIRTH — dry, keep WARM, stimulate</text><text x='430' y='106' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Delay cord clamping ≥60 s if baby is well · hat · plastic bag if preterm &lt;32 wk</text><line x1='430' y1='120' x2='430' y2='140' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='130' y='142' width='600' height='60' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='430' y='167' font-size='14' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Assess tone, breathing, heart rate</text><text x='430' y='188' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Open airway: head in NEUTRAL position (towel under shoulders)</text><line x1='430' y1='202' x2='430' y2='222' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='130' y='224' width='600' height='60' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='430' y='249' font-size='14' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Not breathing / gasping → 5 INFLATION BREATHS</text><text x='430' y='270' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Each 2–3 s, 30 cmH₂O (25 in preterm); start in AIR (21%)</text><line x1='430' y1='284' x2='430' y2='304' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='130' y='306' width='600' height='60' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='430' y='331' font-size='14' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Reassess heart rate (stethoscope / ECG)</text><text x='430' y='352' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>No rise? Check chest is moving: re-position, 2-person jaw thrust, suction</text><line x1='430' y1='366' x2='430' y2='386' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='130' y='388' width='600' height='60' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='430' y='413' font-size='14' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Chest moving → VENTILATION BREATHS 30/min</text><text x='430' y='434' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Recheck HR every 30 s</text><line x1='430' y1='448' x2='430' y2='468' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='130' y='470' width='600' height='60' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='430' y='495' font-size='14' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>HR &lt; 60/min → CHEST COMPRESSIONS 3 : 1</text><text x='430' y='516' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>2 thumbs, lower third of sternum, 1/3 depth · 90 compressions + 30 breaths/min · 100% O₂</text><line x1='430' y1='530' x2='430' y2='550' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='130' y='552' width='600' height='60' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='430' y='577' font-size='14' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Still HR &lt; 60 → drugs via UVC</text><text x='430' y='598' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Adrenaline 10–30 mcg/kg (0.1–0.3 mL/kg of 1:10,000) · consider glucose, volume 10 mL/kg</text><text x='430' y='650' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Target pre-ductal SpO₂ (right hand): 2 min 65% · 5 min 85% · 10 min 90%. APGAR at 1 and 5 min.</text></svg>