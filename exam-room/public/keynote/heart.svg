<svg xmlns='http://www.w3.org/2000/svg' width='800' height='660' viewBox='0 0 800 660' font-family='Arial, Helvetica, sans-serif'><rect width='800' height='660' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='400.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>The Heart — Chambers, Valves and Blood Flow</text><rect x='170' y='120' width='190' height='150' rx='8' fill='#D6EAF8' stroke='#2E6DB4' stroke-width='1.5'/><text x='265' y='190' font-size='15' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>RIGHT ATRIUM</text><text x='265' y='210' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>deoxygenated blood</text><rect x='170' y='300' width='190' height='190' rx='8' fill='#D6EAF8' stroke='#2E6DB4' stroke-width='1.5'/><text x='265' y='390' font-size='15' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>RIGHT VENTRICLE</text><text x='265' y='410' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pumps to lungs</text><text x='265' y='428' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(low pressure ~25/5)</text><rect x='440' y='120' width='190' height='150' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='535' y='190' font-size='15' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>LEFT ATRIUM</text><text x='535' y='210' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>oxygenated blood</text><rect x='440' y='300' width='190' height='190' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='535' y='390' font-size='15' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>LEFT VENTRICLE</text><text x='535' y='410' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>pumps to body</text><text x='535' y='428' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(high pressure ~120/10)</text><rect x='385' y='120' width='30' height='370' fill='#F5EEF8' stroke='#7D3C98'/><text x='400' y='500' font-size='12' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>septum</text><rect x='225' y='275' width='80' height='20' fill='#D68910'/><text x='150' y='290' font-size='13' text-anchor='end' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Tricuspid valve</text><rect x='495' y='275' width='80' height='20' fill='#D68910'/><text x='650' y='290' font-size='13' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Mitral (bicuspid) valve</text><rect x='300' y='495' width='60' height='14' fill='#D68910'/><text x='230' y='528' font-size='13' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Pulmonary valve</text><rect x='440' y='495' width='60' height='14' fill='#D68910'/><text x='570' y='528' font-size='13' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Aortic valve</text><line x1='110' y1='140' x2='165' y2='160' stroke='#2E6DB4' stroke-width='3' marker-end='url(#arB)'/><text x='20' y='135' font-size='13' text-anchor='start' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Superior vena cava</text><line x1='110' y1='250' x2='165' y2='235' stroke='#2E6DB4' stroke-width='3' marker-end='url(#arB)'/><text x='20' y='270' font-size='13' text-anchor='start' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Inferior vena cava</text><line x1='330' y1='512' x2='330' y2='570' stroke='#2E6DB4' stroke-width='3' marker-end='url(#arB)'/><text x='330' y='590' font-size='13' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Pulmonary artery → lungs</text><line x1='690' y1='150' x2='635' y2='175' stroke='#C0392B' stroke-width='3' marker-end='url(#arR)'/><text x='695' y='145' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Pulmonary veins</text><text x='695' y='162' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>← from lungs</text><line x1='470' y1='512' x2='470' y2='570' stroke='#C0392B' stroke-width='3' marker-end='url(#arR)'/><text x='470' y='590' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Aorta → body</text><text x='400' y='620' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Flow: Body → vena cavae → RA → tricuspid → RV → pulmonary valve → pulmonary artery → LUNGS</text><text x='400' y='640' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>→ pulmonary veins → LA → mitral → LV → aortic valve → aorta → BODY</text><text x='400' y='60' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Coronary arteries: RCA (RA, RV, inferior wall, SA &amp; AV nodes in most people) · LAD (anterior wall, septum) · Circumflex (lateral wall)</text></svg>