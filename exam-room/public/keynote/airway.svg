<svg xmlns='http://www.w3.org/2000/svg' width='800' height='480' viewBox='0 0 800 480' font-family='Arial, Helvetica, sans-serif'><rect width='800' height='480' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='400.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Respiratory Tree and Gas Exchange</text><rect x='185' y='60' width='30' height='130' fill='#D5F5E3' stroke='#1E8449'/><text x='150' y='110' font-size='13' text-anchor='end' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Trachea</text><text x='150' y='126' font-size='13' text-anchor='end' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(C-shaped</text><text x='150' y='142' font-size='13' text-anchor='end' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>cartilage)</text><path d='M200,190 L120,290 M200,190 L280,290' stroke='#1E8449' stroke-width='14' fill='none'/><text x='8' y='230' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Right main</text><text x='8' y='245' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>bronchus</text><text x='8' y='260' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(wider, shorter,</text><text x='8' y='275' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>more vertical →</text><text x='8' y='290' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>foreign bodies &amp;</text><text x='8' y='305' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>deep ETT go here)</text><text x='300' y='250' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Left main</text><text x='300' y='265' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>bronchus</text><path d='M120,290 l-30,60 M120,290 l20,70 M280,290 l-20,70 M280,290 l30,60' stroke='#1E8449' stroke-width='7' fill='none'/><text x='200' y='390' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Bronchi → bronchioles → terminal bronchioles</text><text x='200' y='408' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(conducting zone: anatomical dead space ~150 mL)</text><text x='200' y='430' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>→ respiratory bronchioles → alveoli (respiratory zone)</text><text x='200' y='60' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Carina at T4–T5 (angle of Louis)</text><circle cx='590' cy='230' r='120' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='3'/><text x='590' y='150' font-size='16' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ALVEOLUS</text><text x='590' y='175' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>~300 million; surface ~70 m²</text><path d='M470,340 C540,380 640,380 710,340' fill='none' stroke='#C0392B' stroke-width='16' opacity='0.8'/><text x='590' y='395' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Pulmonary capillary</text><line x1='560' y1='220' x2='560' y2='330' stroke='#2E6DB4' stroke-width='3' marker-end='url(#arB)'/><text x='500' y='270' font-size='15' text-anchor='end' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>O₂ in</text><text x='470' y='290' font-size='12' text-anchor='end' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PAO₂ ~100 mmHg</text><line x1='630' y1='330' x2='630' y2='220' stroke='#C0392B' stroke-width='3' marker-end='url(#arR)'/><text x='650' y='270' font-size='15' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CO₂ out</text><text x='650' y='290' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PaCO₂ ~40 mmHg</text><text x='590' y='430' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Type I pneumocytes: gas exchange</text><text x='590' y='446' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Type II: make SURFACTANT (stops alveoli collapsing)</text><text x='590' y='462' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Gas moves by DIFFUSION across a 0.5 µm membrane</text></svg>