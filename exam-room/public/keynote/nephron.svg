<svg xmlns='http://www.w3.org/2000/svg' width='820' height='590' viewBox='0 0 820 590' font-family='Arial, Helvetica, sans-serif'><rect width='820' height='590' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='410.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>The Nephron — Functional Unit of the Kidney</text><circle cx='130' cy='150' r='45' fill='#FADBD8' stroke='#C0392B' stroke-width='2'/><text x='130' y='215' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Glomerulus +</text><text x='130' y='231' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Bowman's capsule</text><text x='130' y='250' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>FILTRATION</text><text x='130' y='265' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>GFR ~125 mL/min</text><text x='130' y='280' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(180 L/day)</text><path d='M175,150 C260,120 300,190 350,160 C400,130 420,190 440,200' fill='none' stroke='#2E6DB4' stroke-width='10'/><text x='300' y='105' font-size='14' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Proximal convoluted tubule</text><text x='300' y='123' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>reabsorbs ~65% Na⁺ &amp; water, ALL glucose,</text><text x='300' y='139' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>amino acids, ~85% HCO₃⁻</text><path d='M440,200 L440,430 C440,470 500,470 500,430 L500,230' fill='none' stroke='#1E8449' stroke-width='10'/><text x='395' y='330' font-size='12' text-anchor='end' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Descending limb:</text><text x='395' y='345' font-size='12' text-anchor='end' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>water OUT</text><text x='520' y='330' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Ascending limb:</text><text x='520' y='345' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Na⁺/K⁺/Cl⁻ OUT,</text><text x='520' y='360' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>impermeable to water</text><text x='520' y='375' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(furosemide acts here)</text><text x='470' y='495' font-size='13' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Loop of Henle — concentrates urine (countercurrent)</text><path d='M500,230 C540,190 600,240 640,190' fill='none' stroke='#D68910' stroke-width='10'/><text x='600' y='165' font-size='14' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Distal convoluted tubule</text><text x='600' y='182' font-size='12' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Na⁺ reabsorbed (thiazides act here)</text><path d='M640,190 L700,190 L700,470' fill='none' stroke='#7D3C98' stroke-width='12'/><text x='715' y='300' font-size='14' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Collecting</text><text x='715' y='317' font-size='14' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>duct</text><text x='715' y='340' font-size='12' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>ADH → water</text><text x='715' y='355' font-size='12' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>reabsorbed</text><text x='715' y='370' font-size='12' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Aldosterone →</text><text x='715' y='385' font-size='12' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Na⁺ in, K⁺ out</text><line x1='700' y1='470' x2='700' y2='520' stroke='#7D3C98' stroke-width='3' marker-end='url(#ar)'/><text x='700' y='540' font-size='12' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Urine (1–2 L/day; ≥0.5 mL/kg/hr)</text><text x='400' y='575' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Kidney also: regulates acid–base (excretes H⁺, makes HCO₃⁻), BP (renin), RBCs (erythropoietin), bones (activates vitamin D)</text></svg>