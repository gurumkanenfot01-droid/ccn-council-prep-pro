<svg xmlns='http://www.w3.org/2000/svg' width='1080' height='740' viewBox='0 0 1080 740' font-family='Arial, Helvetica, sans-serif'><rect width='1080' height='740' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='540.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Chest X-Ray: Where Tubes and Lines Should Sit</text><g transform='translate(70,0)'><rect x='150' y='60' width='560' height='520' rx='30' fill='#1C2833'/><path d='M300,140 C220,180 200,350 220,500 L400,500 L400,170 Z' fill='#566573'/><path d='M560,140 C640,180 660,350 640,500 L460,500 L460,170 Z' fill='#566573'/><line x1='430' y1='80' x2='430' y2='260' stroke='#ABB2B9' stroke-width='14'/><line x1='430' y1='260' x2='390' y2='310' stroke='#ABB2B9' stroke-width='10'/><line x1='430' y1='260' x2='470' y2='310' stroke='#ABB2B9' stroke-width='10'/><path d='M400,330 C380,420 420,480 520,480 C590,470 600,400 560,330 Z' fill='#D5D8DC' opacity='0.85'/><line x1='437' y1='80' x2='437' y2='212' stroke='#F7DC6F' stroke-width='4'/><circle cx='437' cy='214' r='5' fill='#F7DC6F' stroke='#F7DC6F' stroke-width='1.5'/><line x1='395' y1='120' x2='415' y2='300' stroke='#58D68D' stroke-width='4'/><line x1='470' y1='70' x2='485' y2='560' stroke='#F5B7B1' stroke-width='3'/><path d='M200,500 C300,470 560,470 660,500' fill='none' stroke='#AEB6BF' stroke-width='3'/><line x1='442' y1='214' x2='740' y2='190' stroke='#B7950B' stroke-width='1.3'/><text x='746' y='190' font-size='12' text-anchor='start' fill='#B7950B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ETT tip: 3–5 cm ABOVE the carina</text><text x='746' y='205' font-size='12' text-anchor='start' fill='#B7950B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(T2–T4). Too low = right main bronchus</text><text x='746' y='220' font-size='12' text-anchor='start' fill='#B7950B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>→ left lung collapses</text><line x1='415' y1='300' x2='740' y2='290' stroke='#1E8449' stroke-width='1.3'/><text x='746' y='290' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CVC tip: lower SVC / junction with</text><text x='746' y='305' font-size='12' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>right atrium (level of carina)</text><line x1='485' y1='545' x2='740' y2='430' stroke='#C0392B' stroke-width='1.3'/><text x='746' y='430' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>NG tube: down the midline, past the</text><text x='746' y='445' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>carina, tip BELOW the left</text><text x='746' y='460' font-size='12' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>diaphragm in the stomach</text><line x1='430' y1='260' x2='110' y2='250' stroke='#1B2631' stroke-width='1.3'/><text x='104' y='250' font-size='12' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Carina (T4–T5)</text><line x1='300' y1='495' x2='110' y2='470' stroke='#1B2631' stroke-width='1.3'/><text x='104' y='470' font-size='12' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Costophrenic angle:</text><text x='104' y='485' font-size='12' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>sharp = normal;</text><text x='104' y='500' font-size='12' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>blunted = effusion</text></g><rect x='40' y='600' width='1000' height='120' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='60' y='625' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Reading order (ABCDE): Airway (trachea central?) · Breathing (lungs, pneumothorax, effusion) · Cardiac (heart &lt;50% of chest width)</text><text x='60' y='647' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>· Diaphragm (gas under it = perforation) · Everything else (bones, tubes, lines). Portable ICU films are AP: heart looks bigger.</text><text x='60' y='669' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>White = dense (bone, fluid, consolidation). Black = air. Pneumothorax: no lung markings + visible pleural edge.</text><text x='60' y='691' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Always confirm NG tube position by X-ray or aspirate pH ≤5.5 before the first feed. Never use the 'whoosh' test.</text></svg>