<svg xmlns='http://www.w3.org/2000/svg' width='840' height='530' viewBox='0 0 840 530' font-family='Arial, Helvetica, sans-serif'><rect width='840' height='530' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='420.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Central Venous Pressure (CVP) Waveform</text><line x1='60' y1='330' x2='760' y2='330' stroke='#7F8C8D' stroke-width='1'/><path d='M60,260 C90,260 100,170 130,165 C150,165 160,215 175,215 C185,215 190,190 200,190 C215,190 225,280 260,285 C300,285 330,175 365,175 C390,175 400,265 430,270 C470,272 500,260 540,260' fill='none' stroke='#2E6DB4' stroke-width='3.5'/><text x='130' y='150' font-size='22' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>a</text><text x='200' y='175' font-size='22' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>c</text><text x='255' y='305' font-size='22' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>x</text><text x='365' y='160' font-size='22' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>v</text><text x='430' y='295' font-size='22' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>y</text><text x='570' y='120' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>a wave = atrium contracts (lost in AF)</text><text x='570' y='145' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>c wave = tricuspid valve bulges back</text><text x='570' y='170' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>x descent = atrium relaxes</text><text x='570' y='195' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>v wave = atrium fills while closed</text><text x='570' y='220' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>     (giant v = tricuspid regurgitation)</text><text x='570' y='245' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>y descent = valve opens, atrium empties</text><rect x='40' y='360' width='760' height='150' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='60' y='390' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Normal CVP = 2–8 mmHg (3–10 cmH₂O). Read at END-EXPIRATION, supine, transducer at phlebostatic axis.</text><text x='60' y='415' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>HIGH CVP: fluid overload, right heart failure, tamponade, tension pneumothorax, PEEP, PE, pulmonary hypertension.</text><text x='60' y='438' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>LOW CVP: hypovolaemia (bleeding, dehydration, diuresis), vasodilation (sepsis, anaphylaxis, spinal shock).</text><text x='60' y='461' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>The TREND (and response to a fluid challenge) matters more than a single number.</text><text x='60' y='484' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Kussmaul sign: CVP/JVP RISES on inspiration (constrictive pericarditis, tamponade, RV infarct).</text></svg>