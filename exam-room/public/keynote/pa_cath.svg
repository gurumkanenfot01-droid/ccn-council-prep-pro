<svg xmlns='http://www.w3.org/2000/svg' width='860' height='540' viewBox='0 0 860 540' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='540' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Pulmonary Artery (Swan–Ganz) Catheter: Pressures as it Advances</text><rect x='40' y='60' width='180' height='270' rx='8' fill='#FDFEFE' stroke='#2E6DB4' stroke-width='1.5'/><text x='130' y='85' font-size='13' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Right atrium (RA / CVP)</text><g transform='translate(70,210)'><path d='M0,0 C10,-12 20,-12 30,0 C40,-10 50,-10 60,0 C70,-12 80,-12 90,0 C100,-10 110,-10 120,0' fill='none' stroke='#2E6DB4' stroke-width='3'/></g><text x='130' y='260' font-size='16' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>2–6 mmHg</text><text x='130' y='290' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Small a and v waves</text><line x1='222' y1='195' x2='278' y2='195' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='240' y='60' width='180' height='270' rx='8' fill='#FDFEFE' stroke='#7D3C98' stroke-width='1.5'/><text x='330' y='85' font-size='13' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Right ventricle (RV)</text><g transform='translate(270,210)'><path d='M0,0 L10,-90 L40,-90 L50,0 L70,0 L80,-90 L110,-90 L120,0' fill='none' stroke='#7D3C98' stroke-width='3'/></g><text x='330' y='260' font-size='16' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>15–25 / 0–8</text><text x='330' y='290' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Tall, square; diastole near zero</text><line x1='422' y1='195' x2='478' y2='195' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='440' y='60' width='180' height='270' rx='8' fill='#FDFEFE' stroke='#C0392B' stroke-width='1.5'/><text x='530' y='85' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Pulmonary artery (PA)</text><g transform='translate(470,210)'><path d='M0,-35 L10,-90 C20,-95 25,-60 32,-60 L36,-65 C45,-55 55,-40 60,-35 L70,-90 C80,-95 85,-60 92,-60 L96,-65 C105,-55 115,-40 120,-35' fill='none' stroke='#C0392B' stroke-width='3'/></g><text x='530' y='260' font-size='16' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>15–25 / 8–15</text><text x='530' y='290' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Dicrotic notch; diastole RISES</text><line x1='622' y1='195' x2='678' y2='195' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='640' y='60' width='180' height='270' rx='8' fill='#FDFEFE' stroke='#1E8449' stroke-width='1.5'/><text x='730' y='85' font-size='13' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Wedge (PAWP / PCWP)</text><g transform='translate(670,210)'><path d='M0,0 C10,-14 20,-14 30,0 C40,-12 50,-12 60,0 C70,-14 80,-14 90,0 C100,-12 110,-12 120,0' fill='none' stroke='#1E8449' stroke-width='3'/></g><text x='730' y='260' font-size='16' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>6–12 mmHg</text><text x='730' y='290' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Balloon up → shows LEFT atrium</text><rect x='40' y='350' width='780' height='170' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='60' y='378' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Catheter is floated: neck vein → RA → RV → PA → wedges in a small PA branch (balloon 1.5 mL air).</text><text x='60' y='402' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PAWP HIGH (>18): left heart failure, mitral stenosis/regurgitation, fluid overload, cardiogenic shock.</text><text x='60' y='424' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>PAWP LOW (&lt;6): hypovolaemia. Normal PAWP + high PA pressure = pre-capillary pulmonary hypertension.</text><text x='60' y='446' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Never leave the balloon inflated (>15 s) → pulmonary infarction. RV trace on screen = catheter slipped back.</text><text x='60' y='468' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Also measures cardiac output (thermodilution) and mixed venous O₂ sat (SvO₂ normal 60–80%).</text><text x='60' y='490' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Only deflate passively; use air never fluid; ECG monitoring during insertion (ventricular ectopics).</text></svg>