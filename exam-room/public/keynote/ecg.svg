ont-weight='bold'>R</text><text x='345' y='375' font-size='18' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>S</text><text x='510' y='220' font-size='18' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>T</text><line x1='120' y1='420' x2='295' y2='420' stroke='#1E8449' stroke-width='2' marker-end='url(#ar)'/><line x1='295' y1='420' x2='120' y2='420' stroke='#1E8449' stroke-width='2' marker-end='url(#ar)'/><text x='207' y='440' font-size='13' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PR interval 0.12–0.20 s</text><line x1='295' y1='470' x2='360' y2='470' stroke='#7D3C98' stroke-width='2' marker-end='url(#ar)'/><line x1='360' y1='470' x2='295' y2='470' stroke='#7D3C98' stroke-width='2' marker-end='url(#ar)'/><text x='327' y='490' font-size='13' text-anchor='middle' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>QRS &lt; 0.12 s</text><line x1='295' y1='520' x2='590' y2='520' stroke='#C0392B' stroke-width='2' marker-end='url(#ar)'/><line x1='590' y1='520' x2='295' y2='520' stroke='#C0392B' stroke-width='2' marker-end='url(#ar)'/><text x='442' y='540' font-size='13' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>QT interval ~0.36–0.44 s (QTc &lt; 0.44–0.46 s)</text><line x1='360' y1='292' x2='430' y2='292' stroke='#D68910' stroke-width='3'/><text x='395' y='282' font-size='12' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ST segment</text><text x='640' y='110' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>P = atrial depolarisation</text><text x='640' y='130' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>QRS = ventricular</text><text x='640' y='146' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>  depolarisation</text><text x='640' y='166' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>T = ventricular</text><text x='640' y='182' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>  repolarisation</text><text x='640' y='202' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>ST ↑ = injury (STEMI)</text><text x='640' y='220' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>ST ↓ / T inversion =</text><text x='640' y='236' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>  ischaemia</text><text x='400' y='575' font-size='12' text-anchor='middle' fill='#7F8C8D' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Paper speed 25 mm/s: 1 small square = 0.04 s, 1 large square = 0.20 s · Rate = 300 ÷ large squares between R waves (or 1500 ÷ small squares)</text></svg>