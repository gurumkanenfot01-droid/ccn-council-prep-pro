296' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><text x='188' y='336' font-size='14' text-anchor='end' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>B+</text><rect x='200' y='310' width='60' height='38' fill='#D5F5E3'/><text x='231.0' y='336' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='262' y='310' width='60' height='38' fill='#D5F5E3'/><text x='293.0' y='336' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='324' y='310' width='60' height='38' fill='#FADBD8'/><text x='355.0' y='336' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><rect x='386' y='310' width='60' height='38' fill='#FADBD8'/><text x='417.0' y='336' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><rect x='448' y='310' width='60' height='38' fill='#D5F5E3'/><text x='479.0' y='336' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='510' y='310' width='60' height='38' fill='#D5F5E3'/><text x='541.0' y='336' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='572' y='310' width='60' height='38' fill='#FADBD8'/><text x='603.0' y='336' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><rect x='634' y='310' width='60' height='38' fill='#FADBD8'/><text x='665.0' y='336' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><text x='188' y='376' font-size='14' text-anchor='end' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>AB−</text><rect x='200' y='350' width='60' height='38' fill='#D5F5E3'/><text x='231.0' y='376' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='262' y='350' width='60' height='38' fill='#FADBD8'/><text x='293.0' y='376' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><rect x='324' y='350' width='60' height='38' fill='#D5F5E3'/><text x='355.0' y='376' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='386' y='350' width='60' height='38' fill='#FADBD8'/><text x='417.0' y='376' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><rect x='448' y='350' width='60' height='38' fill='#D5F5E3'/><text x='479.0' y='376' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='510' y='350' width='60' height='38' fill='#FADBD8'/><text x='541.0' y='376' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><rect x='572' y='350' width='60' height='38' fill='#D5F5E3'/><text x='603.0' y='376' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='634' y='350' width='60' height='38' fill='#FADBD8'/><text x='665.0' y='376' font-size='16' text-anchor='middle' fill='#C0392B' font-weight='bold'>✗</text><text x='188' y='416' font-size='14' text-anchor='end' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>AB+</text><rect x='200' y='390' width='60' height='38' fill='#D5F5E3'/><text x='231.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='262' y='390' width='60' height='38' fill='#D5F5E3'/><text x='293.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='324' y='390' width='60' height='38' fill='#D5F5E3'/><text x='355.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='386' y='390' width='60' height='38' fill='#D5F5E3'/><text x='417.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='448' y='390' width='60' height='38' fill='#D5F5E3'/><text x='479.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='510' y='390' width='60' height='38' fill='#D5F5E3'/><text x='541.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='572' y='390' width='60' height='38' fill='#D5F5E3'/><text x='603.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='634' y='390' width='60' height='38' fill='#D5F5E3'/><text x='665.0' y='416' font-size='16' text-anchor='middle' fill='#1E8449' font-weight='bold'>✓</text><rect x='40' y='450' width='780' height='160' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='60' y='475' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>O− = universal RED-CELL donor (no A, B or D antigens). AB+ = universal red-cell RECIPIENT.</text><text x='60' y='497' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PLASMA is the opposite: AB plasma = universal plasma donor (no anti-A or anti-B antibodies).</text><text x='60' y='519' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Before giving: 2 nurses check patient ID band vs bag vs form at the bedside. Baseline vitals, then 15 min, then hourly.</text><text x='60' y='541' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Start slowly; stay with patient first 15 min. Red cells: finish within 4 hours of leaving the fridge. Platelets: never refrigerate.</text><text x='60' y='563' font-size='13' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Reaction (fever, rigors, back pain, low BP, dark urine): STOP, saline to keep vein open, call doctor, return bag.</text><text x='60' y='585' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>TRALI = lung injury within 6 h (non-cardiogenic oedema). TACO = circulatory overload (high BP, high JVP) → diuretic.</text></svg>