<svg xmlns='http://www.w3.org/2000/svg' width='860' height='640' viewBox='0 0 860 640' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='640' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>CRRT Circuit (Continuous Renal Replacement Therapy)</text><rect x='30' y='220' width='140' height='120' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='100' y='275' font-size='16' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PATIENT</text><text x='100' y='295' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(dialysis catheter)</text><line x1='170' y1='245' x2='280' y2='245' stroke='#C0392B' stroke-width='3' marker-end='url(#arR)'/><text x='225' y='235' font-size='12' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ACCESS (red)</text><text x='225' y='270' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>−ve pressure</text><circle cx='320' cy='245' r='38' fill='#FDFEFE' stroke='#1B2631' stroke-width='2'/><text x='320' y='250' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>BLOOD</text><text x='320' y='265' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>PUMP</text><line x1='358' y1='245' x2='450' y2='245' stroke='#C0392B' stroke-width='3' marker-end='url(#arR)'/><rect x='450' y='170' width='70' height='190' rx='30' fill='#E8F8F5' stroke='#1E8449' stroke-width='2'/><text x='485' y='265' font-size='13' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>FILTER</text><text x='485' y='283' font-size='10' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(haemofilter)</text><line x1='520' y1='330' x2='640' y2='330' stroke='#D68910' stroke-width='3' marker-end='url(#ar)'/><rect x='640' y='300' width='160' height='70' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='720' y='330' font-size='13' text-anchor='middle' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>EFFLUENT bag</text><text x='720' y='350' font-size='11' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(waste + fluid removed)</text><line x1='485' y1='360' x2='485' y2='430' stroke='#2E6DB4' stroke-width='3'/><line x1='485' y1='430' x2='170' y2='430' stroke='#2E6DB4' stroke-width='3'/><line x1='170' y1='430' x2='140' y2='340' stroke='#2E6DB4' stroke-width='3' marker-end='url(#arB)'/><text x='320' y='450' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>RETURN (blue) + air detector</text><rect x='560' y='110' width='220' height='60' rx='8' fill='#D6EAF8' stroke='#2E6DB4' stroke-width='1.5'/><text x='670' y='135' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Replacement fluid (CVVH)</text><text x='670' y='152' font-size='12' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Dialysate (CVVHD)</text><line x1='560' y1='150' x2='525' y2='200' stroke='#2E6DB4' stroke-width='2' marker-end='url(#arB)'/><rect x='30' y='480' width='800' height='140' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='50' y='505' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>CRRT = Continuous Renal Replacement Therapy: slow 24-hour dialysis for UNSTABLE (low BP) patients.</text><text x='50' y='527' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>CVVH = convection (solvent drag, replacement fluid) · CVVHD = diffusion (dialysate) · CVVHDF = both.</text><text x='50' y='549' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Anticoagulation: heparin or CITRATE (watch ionised calcium — give calcium; citrate toxicity = low iCa, high total Ca).</text><text x='50' y='571' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Watch: hypothermia (warm fluids), hypotension, low K/PO₄/Mg, bleeding, filter clotting (rising TMP), catheter infection.</text><text x='50' y='593' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Indications (AEIOU): Acidosis, Electrolytes (K>6.5), Intoxication, Overload (fluid), Uraemia (pericarditis, encephalopathy).</text></svg>