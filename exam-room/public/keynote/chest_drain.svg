<svg xmlns='http://www.w3.org/2000/svg' width='860' height='620' viewBox='0 0 860 620' font-family='Arial, Helvetica, sans-serif'><rect width='860' height='620' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='430.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Underwater-Seal Chest Drain: Three-Chamber System</text><rect x='80' y='140' width='200' height='300' rx='8' fill='#FADBD8' stroke='#C0392B' stroke-width='1.5'/><text x='180' y='165' font-size='14' text-anchor='middle' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>1. COLLECTION</text><text x='95' y='200' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Fluid/blood collects</text><text x='95' y='216' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>here. Mark level +</text><text x='95' y='232' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>time every hour.</text><rect x='82' y='380' width='196' height='58' fill='#C0392B' opacity='0.25'/><rect x='320' y='140' width='200' height='300' rx='8' fill='#D6EAF8' stroke='#2E6DB4' stroke-width='1.5'/><text x='420' y='165' font-size='14' text-anchor='middle' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>2. WATER SEAL</text><text x='335' y='200' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>2 cm water. One-way</text><text x='335' y='216' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>valve: air out, never</text><text x='335' y='232' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>back in. Should</text><text x='335' y='248' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>SWING (tidal) and</text><text x='335' y='264' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>may BUBBLE (air leak).</text><rect x='322' y='330' width='196' height='108' fill='#2E6DB4' opacity='0.25'/><rect x='560' y='140' width='200' height='300' rx='8' fill='#E8F8F5' stroke='#1E8449' stroke-width='1.5'/><text x='660' y='165' font-size='14' text-anchor='middle' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>3. SUCTION CONTROL</text><text x='575' y='200' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Water height (often</text><text x='575' y='216' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>20 cm) sets suction.</text><text x='575' y='232' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>GENTLE continuous</text><text x='575' y='248' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>bubbling = normal.</text><rect x='562' y='300' width='196' height='138' fill='#1E8449' opacity='0.25'/><line x1='40' y1='100' x2='180' y2='100' stroke='#1B2631' stroke-width='3'/><line x1='180' y1='100' x2='180' y2='140' stroke='#1B2631' stroke-width='3' marker-end='url(#ar)'/><text x='40' y='92' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>From patient's chest (pleural space)</text><line x1='700' y1='140' x2='700' y2='100' stroke='#1B2631' stroke-width='3'/><line x1='700' y1='100' x2='800' y2='100' stroke='#1B2631' stroke-width='3' marker-end='url(#ar)'/><text x='800' y='92' font-size='13' text-anchor='end' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>To wall suction</text><rect x='40' y='465' width='780' height='140' rx='8' fill='#FEF5E7' stroke='#D68910' stroke-width='1.5'/><text x='60' y='490' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Keep drain BELOW chest level, tubing without loops, all connections taped. Do NOT routinely clamp.</text><text x='60' y='512' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>No swing = tube blocked/kinked OR lung fully re-expanded. Continuous bubbling in water seal = air leak.</text><text x='60' y='534' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Drain disconnected → put end in sterile water (2–3 cm). Drain pulled out → cover with 3-sided occlusive dressing.</text><text x='60' y='556' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Report: >100–200 mL/hr of blood, sudden stop in drainage with distress, subcutaneous emphysema, chest pain.</text><text x='60' y='578' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Insertion site for pneumothorax/fluid: 'safe triangle' 4th–5th ICS, mid-axillary line.</text></svg>