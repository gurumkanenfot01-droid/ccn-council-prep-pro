<svg xmlns='http://www.w3.org/2000/svg' width='820' height='560' viewBox='0 0 820 560' font-family='Arial, Helvetica, sans-serif'><rect width='820' height='560' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='410.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Renin–Angiotensin–Aldosterone System (RAAS)</text><rect x='200' y='50' width='420' height='50' rx='8' fill='#FDEDEC' stroke='#C0392B' stroke-width='1.5'/><text x='410.0' y='79.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Low BP / low blood volume / low Na⁺ at kidney</text><line x1='410' y1='100' x2='410' y2='130' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='200' y='130' width='420' height='50' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='410.0' y='159.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Kidney (juxtaglomerular cells) releases RENIN</text><line x1='410' y1='180' x2='410' y2='210' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='200' y='210' width='420' height='50' rx='8' fill='#F4F6F7' stroke='#7F8C8D' stroke-width='1.5'/><text x='410.0' y='239.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Angiotensinogen (from liver) → ANGIOTENSIN I</text><line x1='410' y1='260' x2='410' y2='290' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='200' y='290' width='420' height='50' rx='8' fill='#FEF9E7' stroke='#D68910' stroke-width='1.5'/><text x='410.0' y='319.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>ACE (in lungs) → ANGIOTENSIN II  (ACE inhibitors block here)</text><line x1='330' y1='340' x2='160' y2='390' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><line x1='410' y1='340' x2='410' y2='390' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><line x1='490' y1='340' x2='660' y2='390' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='30' y='390' width='250' height='70' rx='8' fill='#FDEDEC' stroke='#C0392B' stroke-width='1.5'/><text x='155.0' y='421.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Vasoconstriction</text><text x='155.0' y='437.0' font-size='13' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>↑ BP directly</text><rect x='290' y='390' width='240' height='70' rx='8' fill='#E9F7EF' stroke='#1E8449' stroke-width='1.5'/><text x='410.0' y='421.0' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Adrenal cortex → ALDOSTERONE</text><text x='410.0' y='437.0' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Na⁺ &amp; water kept, K⁺ lost</text><rect x='540' y='390' width='250' height='70' rx='8' fill='#F5EEF8' stroke='#7D3C98' stroke-width='1.5'/><text x='665.0' y='421.0' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Pituitary → ADH + thirst</text><text x='665.0' y='437.0' font-size='12' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>water kept</text><line x1='410' y1='460' x2='410' y2='500' stroke='#1B2631' stroke-width='2' marker-end='url(#ar)'/><rect x='200' y='500' width='420' height='45' rx='8' fill='#EBF5FB' stroke='#2E6DB4' stroke-width='1.5'/><text x='410.0' y='526.5' font-size='14' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>↑ Blood volume and ↑ BP</text></svg>