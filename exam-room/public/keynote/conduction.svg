<svg xmlns='http://www.w3.org/2000/svg' width='820' height='600' viewBox='0 0 820 600' font-family='Arial, Helvetica, sans-serif'><rect width='820' height='600' fill='white'/><defs><marker id='ar' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1B2631'/></marker><marker id='arR' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#C0392B'/></marker><marker id='arB' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#2E6DB4'/></marker></defs><text x='410.0' y='30' text-anchor='middle' font-size='20' font-weight='bold' fill='#1B2631'>Conduction System of the Heart</text><path d='M250,110 C120,140 110,420 300,520 C420,580 560,520 620,420 C680,300 640,140 520,110 Z' fill='#FDF2E9' stroke='#7F8C8D' stroke-width='2'/><circle cx='300' cy='150' r='16' fill='#C0392B'/><text x='150' y='120' font-size='14' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>1. SA node (pacemaker)</text><text x='150' y='137' font-size='14' text-anchor='start' fill='#C0392B' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>60–100 beats/min</text><line x1='300' y1='150' x2='390' y2='285' stroke='#C0392B' stroke-width='3' marker-end='url(#arR)'/><text x='205' y='230' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>Internodal pathways</text><text x='205' y='246' font-size='13' text-anchor='start' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round'>(atria contract → P wave)</text><circle cx='390' cy='285' r='14' fill='#D68910'/><text x='420' y='262' font-size='13' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>2. AV node — delay ~0.1 s</text><text x='420' y='278' font-size='13' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>(ventricles fill; PR interval)</text><text x='420' y='294' font-size='13' text-anchor='start' fill='#D68910' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>Junctional rate 40–60/min</text><line x1='390' y1='285' x2='400' y2='340' stroke='#7D3C98' stroke-width='4'/><text x='430' y='345' font-size='13' text-anchor='start' fill='#7D3C98' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>3. Bundle of His</text><path d='M400,340 C380,380 340,400 320,470' fill='none' stroke='#2E6DB4' stroke-width='4'/><text x='160' y='470' font-size='13' text-anchor='start' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>4. Right bundle</text><text x='160' y='486' font-size='13' text-anchor='start' fill='#2E6DB4' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>branch</text><path d='M400,340 C430,380 480,400 520,470' fill='none' stroke='#1E8449' stroke-width='4'/><text x='540' y='470' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>4. Left bundle</text><text x='540' y='486' font-size='13' text-anchor='start' fill='#1E8449' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>branch</text><path d='M320,470 q-10,20 -20,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M320,470 q-22,20 -35,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M320,470 q-34,20 -50,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M320,470 q-46,20 -65,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M520,470 q10,20 20,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M520,470 q22,20 35,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M520,470 q34,20 50,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><path d='M520,470 q46,20 65,50' fill='none' stroke='#7F8C8D' stroke-width='2'/><text x='400' y='560' font-size='14' text-anchor='middle' fill='#1B2631' stroke='white' stroke-width='3.5' paint-order='stroke' stroke-linejoin='round' font-weight='bold'>5. Purkinje fibres → ventricles contract (QRS)  ·  Ventricular escape rate 20–40/min</text></svg>