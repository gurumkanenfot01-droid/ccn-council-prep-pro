name: Apply database updates to Supabase

# Runs every file in supabase/updates/ (in name order) against the database.
# Each file must be safe to run more than once. Uses the SUPABASE_DB_URL secret.
# Runs by itself when a file there changes on main, or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/updates/**"
      - ".github/workflows/apply-db-updates.yml"

concurrency:
  group: apply-db-updates
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check the database secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::The SUPABASE_DB_URL secret is missing. Add it in Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi

      - name: Install psql
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Apply updates
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          echo "## Database updates" >> "$GITHUB_STEP_SUMMARY"
          for f in $(ls supabase/updates/*.sql | sort); do
            echo "### $f" | tee -a "$GITHUB_STEP_SUMMARY"
            out=$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -qtA -F ' : ' -f "$f" 2>&1) || { echo "$out"; echo "::error::$f failed"; echo "FAILED" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
            echo "$out"
            echo "$out" | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
          done
